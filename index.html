<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MotraMaster</title>
    <meta name="description" content="Private, offline workout analytics for Motra exports. Everything is parsed on your device." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f2" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('motramaster.settings') || '{}')
          if (s && (s.theme === 'light' || s.theme === 'dark')) document.documentElement.dataset.theme = s.theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
